services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: landmark
      POSTGRES_USER: landmark
      POSTGRES_PASSWORD: landmark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development.
  # (MinIO removed its images from Docker Hub in Sept 2026; RustFS is a
  # maintained, Apache-2.0 drop-in with the same ports and S3 API.)
  s3:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  # Creates the photo bucket and makes objects publicly readable
  # (the frontend loads images straight from S3_PUBLIC_BASE_URL).
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        S3="aws --endpoint-url http://s3:9000"
        n=0
        until $$S3 s3api list-buckets >/dev/null 2>&1; do
          n=$$((n+1))
          [ "$$n" -ge 30 ] && echo "s3 did not become ready" && exit 1
          sleep 2
        done
        $$S3 s3api head-bucket --bucket landmark-photos 2>/dev/null || $$S3 s3api create-bucket --bucket landmark-photos
        cat > /tmp/policy.json <<'EOF'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::landmark-photos/*"]}]}
        EOF
        $$S3 s3api put-bucket-policy --bucket landmark-photos --policy file:///tmp/policy.json

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build:
      context: ./backend
    #ports:
      #- "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/landmark
      DB_USERNAME: landmark
      DB_PASSWORD: landmark
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_BUCKET: landmark-photos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PATH_STYLE_ACCESS: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/landmark-photos
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-min-32-bytes-long}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  pgdata:
  rustfs-data:
  caddy_data:
  caddy_config:
