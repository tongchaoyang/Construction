spring:
  application:
    name: landmark
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 60MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:landmarkadu@gmail.com}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-min-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  notification:
    business-email: ${BUSINESS_NOTIFICATION_EMAIL:landmarkadu@gmail.com}
    from-address: ${MAIL_FROM_ADDRESS:landmarkadu@gmail.com}
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
  sso:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      display-name: ${OIDC_DISPLAY_NAME:SSO}

s3:
  endpoint: ${S3_ENDPOINT:}
  region: ${S3_REGION:us-west-1}
  bucket: ${S3_BUCKET:landmark-photos}
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  path-style-access: ${S3_PATH_STYLE_ACCESS:false}
  public-base-url: ${S3_PUBLIC_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
