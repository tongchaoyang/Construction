spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/landmark
    username: landmark
    password: landmark
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_APP_PASSWORD:}

logging:
  level:
    com.landmarkconstruction: DEBUG

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:landmark-photos}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  path-style-access: ${S3_PATH_STYLE_ACCESS:true}
  public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/landmark-photos}
