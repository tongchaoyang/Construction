<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="changePassword.pageTitle">Change Password | Landmark Construction &amp; ADU</title>
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="change-password">
  <header id="site-header"></header>

  <section>
    <div class="container">
      <div class="form-card">
        <h2 style="margin-top:0;text-align:center;" data-i18n="changePassword.title">Change Password</h2>
        <div id="form-success"></div>
        <div id="form-error"></div>
        <form id="change-password-form">
          <div class="form-group">
            <label for="currentPassword" data-i18n="changePassword.current">Current Password</label>
            <input type="password" id="currentPassword" required>
          </div>
          <div class="form-group">
            <label for="newPassword" data-i18n="changePassword.new">New Password</label>
            <input type="password" id="newPassword" minlength="8" required>
            <div class="form-hint" data-i18n="register.passwordHint">At least 8 characters.</div>
          </div>
          <div class="form-group">
            <label for="confirmPassword" data-i18n="changePassword.confirm">Confirm New Password</label>
            <input type="password" id="confirmPassword" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn" data-i18n="changePassword.submit">Update Password</button>
        </form>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script>
    if (!Auth.isLoggedIn()) {
      window.location.href = "/login.html?redirect=" + encodeURIComponent(window.location.href);
    }

    document.getElementById("change-password-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("form-error");
      const successBox = document.getElementById("form-success");
      const submitBtn = document.getElementById("submit-btn");
      errorBox.innerHTML = "";
      successBox.innerHTML = "";

      const currentPassword = document.getElementById("currentPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        errorBox.innerHTML = `<div class="alert alert-error" data-i18n="changePassword.mismatch">New passwords do not match.</div>`;
        I18n.apply(errorBox);
        return;
      }

      submitBtn.disabled = true;
      try {
        await api.post("/auth/change-password", { currentPassword, newPassword });
        successBox.innerHTML = `<div class="alert alert-success" data-i18n="changePassword.success">Your password has been updated.</div>`;
        I18n.apply(successBox);
        document.getElementById("change-password-form").reset();
      } catch (err) {
        errorBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
