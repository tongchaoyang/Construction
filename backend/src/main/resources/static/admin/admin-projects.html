<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Projects | Landmark Construction &amp; ADU</title>
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="admin-header"></header>
  <section class="page-banner">
    <div class="container">
      <div class="section-title">
        <h2>Projects</h2>
      </div>
    </div>
  </section>

  <div class="admin-shell">
    <nav class="admin-sidebar" id="admin-sidebar"></nav>
    <main class="admin-content">
      <div class="admin-toolbar" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="new-project-btn">+ New Project</button>
      </div>
      <div id="list-error"></div>
      <table class="data-table">
        <thead>
          <tr><th>Cover</th><th>Title (EN)</th><th>Category</th><th>Status</th><th>Rating</th><th>Actions</th></tr>
        </thead>
        <tbody id="projects-tbody"></tbody>
      </table>
    </main>
  </div>

  <div class="modal-overlay" id="project-modal-overlay" style="display:none;">
    <div class="modal-card">
      <h2 id="project-modal-title">New Project</h2>
      <div id="project-form-error"></div>
      <form id="project-form">
        <input type="hidden" id="project-id">
        <div class="form-group">
          <label>Title (English)</label>
          <input type="text" id="titleEn" required>
        </div>
        <div class="form-group">
          <label>Title (中文)</label>
          <input type="text" id="titleZh" required>
        </div>
        <div class="form-group">
          <label>Description (English)</label>
          <textarea id="descriptionEn" required></textarea>
        </div>
        <div class="form-group">
          <label>Description (中文)</label>
          <textarea id="descriptionZh" required></textarea>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="category" required>
            <option value="NEW_CONSTRUCTION">New Construction</option>
            <option value="ADU">ADU</option>
            <option value="REMODELING">Remodeling</option>
            <option value="EARTHQUAKE_RETROFIT">Earthquake Retrofit</option>
          </select>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g. San Jose, CA">
        </div>
        <div class="form-group">
          <label>Completed Date</label>
          <input type="date" id="completedDate">
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="published" checked style="width:auto;"> Published (visible to public)</label>
        </div>
      </form>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="project-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="project-modal-save">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="images-modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:720px;">
      <h2>Manage Photos</h2>
      <div id="images-error"></div>
      <div class="image-manager" id="image-manager"></div>
      <div class="form-group">
        <label>Upload New Photos</label>
        <input type="file" id="new-images-input" accept="image/png,image/jpeg,image/webp" multiple>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="images-modal-close">Close</button>
        <button class="btn btn-primary" id="upload-images-btn">Upload</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reviews-modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:640px;">
      <h2>Moderate Reviews</h2>
      <div id="reviews-error"></div>
      <div id="reviews-manager"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="reviews-modal-close">Close</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/admin/admin-shell.js"></script>
  <script src="/assets/js/admin/admin-projects.js"></script>
</body>
</html>
