<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Requests | Landmark Construction &amp; ADU</title>
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="admin-header"></header>
  <section class="page-banner">
    <div class="container">
      <div class="section-title">
        <h2>Quote Requests</h2>
      </div>
    </div>
  </section>

  <div class="admin-shell">
    <nav class="admin-sidebar" id="admin-sidebar"></nav>
    <main class="admin-content">
      <div class="filter-bar" id="status-filter">
        <button data-status="" class="active">All</button>
        <button data-status="NEW">New</button>
        <button data-status="CONTACTED">Contacted</button>
        <button data-status="IN_PROGRESS">In Progress</button>
        <button data-status="COMPLETED">Completed</button>
        <button data-status="CLOSED">Closed</button>
      </div>
      <div id="list-error"></div>
      <table class="data-table">
        <thead>
          <tr><th>Name</th><th>Contact</th><th>Category</th><th>Status</th><th>Received</th><th>Actions</th></tr>
        </thead>
        <tbody id="quotes-tbody"></tbody>
      </table>
    </main>
  </div>

  <div class="modal-overlay" id="quote-modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:700px;">
      <h2>Quote Request Detail</h2>
      <div id="quote-detail-body"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="quote-modal-close">Close</button>
        <button class="btn btn-primary" id="quote-modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/admin/admin-shell.js"></script>
  <script src="/assets/js/admin/admin-quotes.js"></script>
</body>
</html>
