<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Landmark Construction &amp; ADU</title>
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/index.html" class="brand">
        <img src="/assets/images/logo.png" alt="logo">
        <span class="brand-name">Landmark Construction &amp; ADU<small>Admin Portal</small></span>
      </a>
    </div>
  </header>

  <section>
    <div class="container">
      <div class="form-card">
        <h2 style="margin-top:0;text-align:center;">Admin Login</h2>
        <div id="form-error"></div>
        <form id="admin-login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
        </form>
        <div id="sso-buttons"></div>
      </div>
    </div>
  </section>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sso.js"></script>
  <script>
    renderSsoButtons("sso-buttons");

    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) {
      document.getElementById("form-error").innerHTML =
        `<div class="alert alert-error">Single sign-on failed. Please try again or log in with your password.</div>`;
    } else if (params.get("expired")) {
      document.getElementById("form-error").innerHTML =
        `<div class="alert alert-error">Your session has expired. Please log in again.</div>`;
    }

    document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("form-error");
      errorBox.innerHTML = "";
      try {
        const res = await Auth.login(document.getElementById("email").value.trim(), document.getElementById("password").value);
        if (res.user.role !== "ADMIN") {
          Auth.logout();
          throw new Error("This account does not have admin access.");
        }
        window.location.href = "/admin/admin-dashboard.html";
      } catch (err) {
        errorBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
