<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="register.pageTitle">Sign Up | Landmark Construction &amp; ADU</title>
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="register">
  <header id="site-header"></header>

  <section class="page-banner">
    <div class="container">
      <div class="section-title">
        <h2 data-i18n="register.title">Create Your Account</h2>
        <p data-i18n="register.subtitle">An account lets you rate and comment on our completed projects.</p>
      </div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="form-card">
        <div id="form-error"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="fullName" data-i18n="register.fullName">Full Name</label>
            <input type="text" id="fullName" required>
          </div>
          <div class="form-group">
            <label for="email" data-i18n="register.email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="form-group">
            <label for="phone" data-i18n="register.phone">Phone (optional)</label>
            <input type="tel" id="phone">
          </div>
          <div class="form-group">
            <label for="password" data-i18n="register.password">Password</label>
            <input type="password" id="password" minlength="8" required>
            <div class="form-hint" data-i18n="register.passwordHint">At least 8 characters.</div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="register.submit">Sign Up</button>
        </form>
        <div id="sso-buttons"></div>
        <p style="text-align:center;margin-top:16px;">
          <span data-i18n="register.haveAccount">Already have an account?</span>
          <a href="/login.html" data-i18n="nav.login">Log in</a>
        </p>
      </div>
    </div>
  </section>

  <footer id="site-footer"></footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/sso.js"></script>
  <script>
    renderSsoButtons("sso-buttons");

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("form-error");
      errorBox.innerHTML = "";
      try {
        await Auth.register(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value,
          document.getElementById("fullName").value.trim(),
          document.getElementById("phone").value.trim()
        );
        const redirect = new URLSearchParams(window.location.search).get("redirect");
        window.location.href = redirect || "/index.html";
      } catch (err) {
        errorBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
